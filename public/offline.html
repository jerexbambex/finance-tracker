<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Penniepal</title>
  <style>
    html { background: oklch(1 0 0); }
    @media (prefers-color-scheme: dark) { html { background: oklch(0.145 0 0); } }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #111;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { color: #eee; } }
    .card { max-width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.7; line-height: 1.5; }
    button {
      margin-top: 20px; padding: 10px 20px; border-radius: 8px; border: none;
      background: #10b981; color: white; font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Penniepal needs a connection to show your accounts and transactions —
       nothing financial is ever cached for offline viewing, so numbers you'd
       see here are never stale or wrong.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
